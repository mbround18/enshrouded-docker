[package]
name = "enshrouded"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/mbround18/enshrouded-docker"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
regex = "1.12.3"
lazy_static = "1.5.0"
chrono = { version = "0.4.43", features = ["serde"] }
reqwest = { version = "0.13", features = [
  "blocking",
  "stream",
  "json",
  "rustls",
] }
flate2 = "1.1"
tar = "0.4"

# Replace the path dependencies with git dependencies pointing to the monorepo
gsm-instance = { git = "https://github.com/mbround18/game-server-management.git", package = "gsm-instance", branch = "main" }
gsm-cron = { git = "https://github.com/mbround18/game-server-management.git", package = "gsm-cron", branch = "main" }
gsm-shared = { git = "https://github.com/mbround18/game-server-management.git", package = "gsm-shared", branch = "main" }
gsm-monitor = { git = "https://github.com/mbround18/game-server-management.git", package = "gsm-monitor", branch = "main" }
gsm-notifications = { git = "https://github.com/mbround18/game-server-management.git", package = "gsm-notifications", branch = "main" }
env-parse = { git = "https://github.com/mbround18/game-server-management.git", package = "env-parse", branch = "main" }


[dev-dependencies]
tempfile = "3.25.0"
